# Automated secret rotation via the External Secrets Operator (doc roadmap #7).
# Install ESO first: https://external-secrets.io/latest/introduction/getting-started/
#
# Instead of `kubectl apply`-ing a static Secret (k8s/secrets.example.yaml), the
# real credentials live in an external manager (AWS Secrets Manager here; Vault /
# GCP Secret Manager / Azure Key Vault work the same way). ESO pulls them on a
# schedule and writes the in-cluster `elfaria-secrets` Secret the pods consume —
# so when you rotate a value in the manager, it propagates automatically.
#
# ── Rotation actually taking effect ───────────────────────────────────────────
# ESO updating the Secret does NOT restart pods, and the bot reads its config at
# boot. To pick up rotated values, run Stakater Reloader and annotate the bot
# workload so it rolls when the Secret changes:
#   metadata.annotations:
#     reloader.stakater.com/auto: "true"
# (A StatefulSet rolls one shard range at a time — see docs/SCALING_SHARDING.md —
# so rotation is a zero-to-minimal-downtime event.)
---
# How to reach the external manager. ClusterSecretStore is cluster-scoped; use a
# namespaced SecretStore if you prefer. Auth shown is AWS IRSA (a ServiceAccount
# annotated with an IAM role) — no static cloud keys in the cluster.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: elfaria-aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# The mapping: which manager keys become which keys in `elfaria-secrets`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: elfaria-secrets
  namespace: elfaria
spec:
  # Re-pull every hour → rotations propagate within the hour without redeploys.
  refreshInterval: 1h
  secretStoreRef:
    name: elfaria-aws
    kind: ClusterSecretStore
  target:
    name: elfaria-secrets # the Secret the bot's env refers to
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: elfaria/discord
        property: token
    - secretKey: DISCORD_CLIENT_ID
      remoteRef:
        key: elfaria/discord
        property: clientId
    - secretKey: LAVALINK_PASSWORD
      remoteRef:
        key: elfaria/lavalink
        property: password
    - secretKey: SPOTIFY_CLIENT_ID
      remoteRef:
        key: elfaria/spotify
        property: clientId
    - secretKey: SPOTIFY_CLIENT_SECRET
      remoteRef:
        key: elfaria/spotify
        property: clientSecret
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: elfaria/postgres
        property: password
