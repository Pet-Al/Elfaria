# Copy to secrets.yaml, fill in real values, and `kubectl apply -f secrets.yaml`.
# NEVER commit the filled-in version — secrets.yaml is gitignored. In production
# prefer Sealed Secrets, External Secrets Operator, or your cloud's secret store
# instead of a plain manifest.
#
# stringData lets you paste plaintext; Kubernetes base64-encodes it for you.
apiVersion: v1
kind: Secret
metadata:
  name: elfaria-secrets
  namespace: elfaria
type: Opaque
stringData:
  DISCORD_TOKEN: 'your-bot-token-here'
  DISCORD_CLIENT_ID: 'your-application-id-here'
  # Shared by every Lavalink pod AND the bot. Per-node auth is omitted from
  # LAVALINK_NODES, so all nodes inherit this one value (see src/config.ts).
  LAVALINK_PASSWORD: 'change-me-to-something-strong'
  # Optional — enables Spotify. Leave blank to run without it.
  SPOTIFY_CLIENT_ID: ''
  SPOTIFY_CLIENT_SECRET: ''
  # Postgres credentials (consumed by both the postgres pod and the bot).
  POSTGRES_PASSWORD: 'change-me-too'
