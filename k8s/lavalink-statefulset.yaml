# Lavalink as a StatefulSet — the audio tier that the HPA scales (k8s/lavalink-hpa.yaml).
#
# Why StatefulSet (not Deployment): we need stable, ordinal pod identities
# (lavalink-0, lavalink-1, …) with matching DNS so the bot can address each node.
# Deployment pods get random names and no per-pod DNS.
#
# Resource *requests* are mandatory for CPU-based autoscaling: the HPA computes
# utilisation as (usage / request), so without a request there is no percentage
# to target.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lavalink
  namespace: elfaria
spec:
  serviceName: lavalink-hl
  # Starting size. The HPA owns this number at runtime (1..maxReplicas); we set a
  # modest baseline here for the first apply.
  replicas: 1
  selector:
    matchLabels:
      app: lavalink
  template:
    metadata:
      labels:
        app: lavalink
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: lavalink
          image: ghcr.io/lavalink-devs/lavalink:4
          ports:
            - name: ws
              containerPort: 2333
          env:
            - name: _JAVA_OPTIONS
              value: '-Xmx512m'
            - name: SERVER_PORT
              value: '2333'
            - name: LAVALINK_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elfaria-secrets
                  key: LAVALINK_PASSWORD
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: elfaria-secrets
                  key: SPOTIFY_CLIENT_ID
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elfaria-secrets
                  key: SPOTIFY_CLIENT_SECRET
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1'
              memory: '1Gi'
          # Lavalink's /version endpoint is unauthenticated — handy for probes.
          readinessProbe:
            httpGet:
              path: /version
              port: 2333
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /version
              port: 2333
            initialDelaySeconds: 40
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /opt/Lavalink/application.yml
              subPath: application.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            # Defined in lavalink-configmap.yaml (kept in sync with the repo's
            # lavalink/application.yml).
            name: lavalink-config
