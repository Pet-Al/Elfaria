# Lavalink audio service configuration (doc §3 Option B).
#
# The bot sends play commands here; Lavalink does all sourcing, transcoding,
# encryption, and UDP streaming. YouTube support comes from the youtube-source
# plugin (Lavalink's built-in YouTube was removed in v4). When YouTube changes,
# bump the plugin version below — you update this service, not the whole bot.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube source plugin. Check https://github.com/lavalink-devs/youtube-source
    # for the latest version if YouTube playback breaks, then restart lavalink.
    - dependency: 'dev.lavalink.youtube:youtube-plugin:1.18.1'
      repository: 'https://maven.lavalink.dev/releases'
    # ── Spotify / Apple Music / Deezer (OPT-IN) ───────────────────────────────
    # Uncomment the LavaSrc plugin below to enable Spotify links + `spsearch:`.
    # Spotify gives metadata only; LavaSrc resolves the actual audio from
    # YouTube/SoundCloud. To enable:
    #   1. Get credentials at https://developer.spotify.com/dashboard (create an
    #      app) and put them in .env as SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET.
    #   2. Uncomment the two lines below AND the `lavasrc:` block lower down.
    #   3. Confirm the latest version at
    #      https://github.com/lavalink-devs/lavasrc/releases (bump if needed).
    #   4. docker compose up -d --force-recreate lavalink
    # - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.7.3'
    #   repository: 'https://maven.lavalink.dev/releases'
  server:
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      # Disable Lavalink's built-in YouTube so the plugin handles it.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000

plugins:
  youtube:
    enabled: true
    # Innertube clients the plugin rotates through. If YouTube streaming breaks,
    # adjusting this list (or updating the plugin version above) is the fix.
    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
      - TVHTML5EMBEDDED
  # ── Spotify / Apple Music / Deezer (OPT-IN) ─────────────────────────────────
  # Uncomment this whole `lavasrc:` block together with the LavaSrc plugin
  # dependency above. Spotify needs SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET
  # set in .env (passed through by docker-compose).
  # lavasrc:
  #   sources:
  #     spotify: true
  #     applemusic: false
  #     deezer: false
  #   spotify:
  #     clientId: '${SPOTIFY_CLIENT_ID}'
  #     clientSecret: '${SPOTIFY_CLIENT_SECRET}'
  #     countryCode: 'US'

logging:
  level:
    root: INFO
    lavalink: INFO
