# Lavalink audio service configuration (doc §3 Option B).
#
# The bot sends play commands here; Lavalink does all sourcing, transcoding,
# encryption, and UDP streaming. YouTube support comes from the youtube-source
# plugin (Lavalink's built-in YouTube was removed in v4). When YouTube changes,
# bump the plugin version below — you update this service, not the whole bot.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube source plugin. Check https://github.com/lavalink-devs/youtube-source
    # for the latest version if YouTube playback breaks, then restart lavalink.
    - dependency: 'dev.lavalink.youtube:youtube-plugin:1.18.1'
      repository: 'https://maven.lavalink.dev/releases'
    # LavaSrc — enables Spotify / Apple Music / Deezer (metadata only; the audio
    # is bridged from YouTube/SoundCloud). Spotify needs SPOTIFY_CLIENT_ID /
    # SPOTIFY_CLIENT_SECRET in .env (see README → "Enabling Spotify"); until they
    # are set, Spotify requests just fail and everything else works normally.
    # If Lavalink fails to boot here, bump the version — latest at
    # https://github.com/lavalink-devs/lavasrc/releases
    - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.8.3'
      repository: 'https://maven.lavalink.dev/releases'
    # SponsorBlock — lets the bot skip non-music segments (sponsor reads, intros,
    # "music_offtopic" talking sections) inside YouTube tracks, using the
    # community SponsorBlock database. Adding the dependency exposes the REST
    # endpoints lavalink-client calls via player.setSponsorBlock(); the per-guild
    # toggle is /sponsorblock. If Lavalink fails to boot here, bump the version:
    # https://github.com/topi314/Sponsorblock-Plugin/releases
    - dependency: 'com.github.topi314.sponsorblock:sponsorblock-plugin:3.0.1'
      repository: 'https://maven.lavalink.dev/releases'
    # ── Added/migrated plugins (see docs/PLUGINS.md). All coordinates are VERIFIED
    # to resolve — one bad/unpublished coordinate aborts PluginManager and crash-
    # loops the whole node. Some are flag-gated on the bot side (LYRICS_SOURCE,
    # LAVA_DSPX, LAVASEARCH) so the old code paths stay default until confirmed;
    # java-timed-lyrics just loads. NOTE: resolving is necessary but not sufficient
    # — a plugin can still fail at boot if its jar isn't self-contained (see the
    # DuncteBot note below). Bump any version that fails to boot.
    #
    # LavaSearch — richer search: returns tracks, albums, artists, playlists and
    # text suggestions (lavalink-client: player.lavaSearch()).
    - dependency: 'com.github.topi314.lavasearch:lavasearch-plugin:1.0.0'
      repository: 'https://maven.lavalink.dev/releases'
    # LavaLyrics — a lyrics API other plugins/clients consume; LavaSrc feeds it
    # (lavalink-client: player.getCurrentLyrics()). Enables native synced lyrics.
    - dependency: 'com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0'
      repository: 'https://maven.lavalink.dev/releases'
    # LavaDSPX — extra DSP filters (normalization, high/low-pass, echo) behind the
    # /filter Normalize & Echo presets. Coordinate verified against the plugin's
    # JitPack build: the org is capital-"Devoxin" and 0.0.5 is the latest tag —
    # the earlier `devoxin:...:2.0.0` never existed, which is what 404'd and
    # crash-looped the node. JitPack builds on demand, so the tag must exist.
    # Flag-gated by LAVA_DSPX (default off); fail-soft.
    - dependency: 'com.github.Devoxin:LavaDSPX-Plugin:0.0.5'
      repository: 'https://jitpack.io'
    # DuncteBot (skybot) — DISABLED. The 1.7.1 jar downloads and loads, but its
    # injector needs classes from a SEPARATE `com.dunctebot:sourcemanagers`
    # library (e.g. GetyarnAudioSourceManager) that isn't bundled in the jar, and
    # Lavalink's plugin loader only fetches the one declared jar — not transitive
    # Maven deps — so it threw NoClassDefFoundError and crash-looped the node.
    # Re-enable only with a self-contained (fat) build or by also providing the
    # sourcemanagers jar on the classpath. This also gates /tts (TTS_ENABLED).
    # - dependency: 'com.dunctebot:skybot-lavalink-plugin:1.7.1'
    #   repository: 'https://maven.lavalink.dev/releases'
    # java-timed-lyrics — timestamped (synced) lyrics from YouTube with a Genius
    # fallback; registers as an extra LavaLyrics provider. It is NOT on the
    # lavalyrics priority list by default (LavaSrc stays primary, proven path) —
    # add it to plugins.lavalyrics.sources to prefer it.
    - dependency: 'me.duncte123:java-lyrics-plugin:1.6.6'
      repository: 'https://maven.lavalink.dev/releases'
    #
    # ── Declared but commented (one line from enabling; off for a stated reason) ─
    # XM — tracker-module formats (.mod/.xm/.s3m chiptune). Verified
    # (net.esmbot:lava-xm-plugin:0.2.8) but it lives on a THIRD-PARTY maven
    # (projectlounge.pw); if that host is down Lavalink won't boot — a poor
    # reliability trade for a niche format. Uncomment to enable.
    # - dependency: 'net.esmbot:lava-xm-plugin:0.2.8'
    #   repository: 'https://repo.projectlounge.pw/maven/releases'
    # Google Cloud TTS — higher-quality neural voices than DuncteBot's free
    # `speak:`. Needs a GCP service account (clientEmail/privateKey under
    # plugins.dunctebot.tts, or GOOGLE_APPLICATION_CREDENTIALS). Left off so a
    # missing-creds setup can't destabilise boot; uncomment once creds are set.
    # - dependency: 'com.dunctebot:tts-plugin:1.0.1'
    #   repository: 'https://jitpack.io'
    # lyrics.kt — another synced-lyrics LavaLyrics provider. Redundant with
    # java-timed-lyrics above (two providers would compete); pick one. Verified
    # (dev.schlaubi.lyrics:lavalink:2.6.1). Uncomment if you prefer it.
    # - dependency: 'dev.schlaubi.lyrics:lavalink:2.6.1'
    #   repository: 'https://maven.lavalink.dev/releases'
  server:
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      # Disable Lavalink's built-in YouTube so the plugin handles it.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000

plugins:
  youtube:
    enabled: true
    # Innertube clients the plugin rotates through. Order matters — the plugin
    # tries them in turn. TVHTML5EMBEDDED + MWEB + WEB reliably resolve LIVE
    # streams (e.g. the 24/7 lofi radios used by /lofi); MUSIC/ANDROID_VR often
    # fail on livestreams, which is why some lofi stations wouldn't start before.
    # If streaming breaks, adjust this list or bump the plugin version above.
    clients:
      - MUSIC
      - WEB
      - MWEB
      - TVHTML5EMBEDDED
      - WEBEMBEDDED
      - ANDROID_VR
    # ── Throttling / "the song dies partway through" ──────────────────────────
    # YouTube THROTTLES anonymous web clients: a stream starts fine then stalls a
    # minute or two in (you'll see trackStuck and the song cuts out). The real fix
    # is OAuth — the plugin authenticates as a (BURNER, not your main) Google
    # account, and YouTube stops throttling. To enable:
    #   1. set enabled: true below and (re)start Lavalink,
    #   2. watch the logs for a "device code" URL, visit it, and authorise,
    #   3. copy the printed refreshToken into refreshToken below so it persists
    #      across restarts (otherwise you re-auth each boot).
    # Use a throwaway account — automating a Google login is against YouTube ToS.
    oauth:
      enabled: false
      # refreshToken: 'paste-after-first-run-device-code-flow'
  # LavaLyrics provider priority (only matters with LYRICS_SOURCE=lavalink). LavaSrc
  # below serves the lyrics; verify keys against the LavaLyrics README if it errors.
  lavalyrics:
    sources:
      - lavasrc
  lavasrc:
    sources:
      # Spotify works once SPOTIFY_CLIENT_ID/SECRET are set in .env.
      spotify: true
      applemusic: false
      deezer: false
    # Let LavaSrc answer LavaLyrics requests (used only when LYRICS_SOURCE=lavalink).
    lyrics-sources:
      spotify: true
      deezer: false
      youtube: true
    spotify:
      clientId: '${SPOTIFY_CLIENT_ID:}'
      clientSecret: '${SPOTIFY_CLIENT_SECRET:}'
      countryCode: 'US'
  # DuncteBot (skybot) plugin config — INERT while the plugin is disabled above
  # (Lavalink ignores config for unloaded plugins). Kept ready for re-enabling.
  # NSFW sources (pornhub/soundgasm) are OFF for a general-audience bot. `speak`
  # is the free TTS source /tts would use (no credentials needed).
  dunctebot:
    ttsLanguage: 'en-US'
    sources:
      getyarn: true
      clypit: true
      tts: true
      pornhub: false
      reddit: true
      ocremix: true
      tiktok: true
      mixcloud: true
      soundgasm: false
    # Google Cloud TTS credentials — only used if the (commented) tts-plugin is
    # enabled above. Leave blank to use DuncteBot's free `speak:` source instead.
    tts:
      clientEmail: '${GCP_TTS_CLIENT_EMAIL:}'
      privateKey: '${GCP_TTS_PRIVATE_KEY:}'
  # java-timed-lyrics. countryCode tunes YouTube lyric availability; geniusApiKey
  # (optional) enables the Genius fallback — paste a token to turn it on.
  lyrics:
    countryCode: 'US'
    # geniusApiKey: '${GENIUS_API_KEY:}'

logging:
  level:
    root: INFO
    lavalink: INFO
