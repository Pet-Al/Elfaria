apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: elfaria

resources:
  - namespace.yaml
  - lavalink-configmap.yaml
  - lavalink-service.yaml
  - lavalink-statefulset.yaml
  - lavalink-hpa.yaml
  - redis.yaml
  - postgres.yaml
  - bot-deployment.yaml
  - bot-service.yaml
  - network-policy.yaml

# Point this at your built image (or override with `kustomize edit set image`).
images:
  - name: ghcr.io/pet-al/elfaria
    newTag: latest

# NOTE: the Secret is intentionally NOT generated here — copy secrets.example.yaml
# to secrets.yaml (gitignored), fill it in, and `kubectl apply -f secrets.yaml`.
