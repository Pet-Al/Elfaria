# Full distributed stack for VERIFYING the scale-out features (doc §9).
#
# Use as an OVERRIDE on top of the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build
#
# It turns everything on at once so you can observe each piece working:
#   - a 2nd Lavalink node (lavalink2)  → multi-node
#   - redis                            → shared search cache
#   - postgres                         → Postgres data layer
#   - the bot run SHARDED (2 shards)   → sharding
#
# See the README "Verifying the scale-out features" for the proof commands.
# This is for testing/inspection; for normal use just run the base file.
services:
  lavalink2:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: -Xmx512m
      SERVER_PORT: '2333'
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - '2333'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - '6379'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elfaria
      POSTGRES_PASSWORD: elfaria
      POSTGRES_DB: elfaria
    volumes:
      - elfaria-pg:/var/lib/postgresql/data
    expose:
      - '5432'

  bot:
    # Run under the sharding manager instead of a single process.
    command: ['npm', 'run', 'start:sharded']
    environment:
      # Two Lavalink nodes — sessions balance across them.
      LAVALINK_NODES: '[{"id":"main","host":"lavalink","port":2333,"authorization":"${LAVALINK_PASSWORD:-youshallnotpass}"},{"id":"second","host":"lavalink2","port":2333,"authorization":"${LAVALINK_PASSWORD:-youshallnotpass}"}]'
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://elfaria:elfaria@postgres:5432/elfaria
      SHARDING: 'on'
      SHARD_COUNT: '2'
    depends_on:
      - lavalink
      - lavalink2
      - redis
      - postgres

volumes:
  elfaria-pg:
