# Lavalink audio service configuration (doc §3 Option B).
#
# The bot sends play commands here; Lavalink does all sourcing, transcoding,
# encryption, and UDP streaming. YouTube support comes from the youtube-source
# plugin (Lavalink's built-in YouTube was removed in v4). When YouTube changes,
# bump the plugin version below — you update this service, not the whole bot.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube source plugin. Check https://github.com/lavalink-devs/youtube-source
    # for the latest version if YouTube playback breaks, then restart lavalink.
    - dependency: 'dev.lavalink.youtube:youtube-plugin:1.18.1'
      repository: 'https://maven.lavalink.dev/releases'
    # LavaSrc — enables Spotify / Apple Music / Deezer (metadata only; the audio
    # is bridged from YouTube/SoundCloud). Spotify needs SPOTIFY_CLIENT_ID /
    # SPOTIFY_CLIENT_SECRET in .env (see README → "Enabling Spotify"); until they
    # are set, Spotify requests just fail and everything else works normally.
    # If Lavalink fails to boot here, bump the version — latest at
    # https://github.com/lavalink-devs/lavasrc/releases
    - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.8.3'
      repository: 'https://maven.lavalink.dev/releases'
  server:
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      # Disable Lavalink's built-in YouTube so the plugin handles it.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000

plugins:
  youtube:
    enabled: true
    # Innertube clients the plugin rotates through. These are the names valid in
    # youtube-source 1.18.x; if streaming breaks, adjusting this list (or bumping
    # the plugin version above) is the fix.
    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
  lavasrc:
    sources:
      # Spotify works once SPOTIFY_CLIENT_ID/SECRET are set in .env.
      spotify: true
      applemusic: false
      deezer: false
    spotify:
      clientId: '${SPOTIFY_CLIENT_ID:}'
      clientSecret: '${SPOTIFY_CLIENT_SECRET:}'
      countryCode: 'US'

logging:
  level:
    root: INFO
    lavalink: INFO
