# Elfaria + Lavalink (doc §3 Option B, §9, §11).
#
# Two always-on containers on a private network:
#   - lavalink: the audio service (does all sourcing/transcoding/streaming).
#   - bot:      the discord.js gateway client; forwards voice to Lavalink.
#
# Set LAVALINK_PASSWORD in .env to secure the link (both services read it).
services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: -Xmx512m
      SERVER_PORT: '2333'
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    # Not published to the host — only the bot (same network) can reach it.
    expose:
      - '2333'

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # These override .env so the bot always reaches the lavalink container.
    environment:
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: '2333'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    depends_on:
      - lavalink
    volumes:
      # Persist the SQLite database across container restarts/redeploys.
      - elfaria-data:/app/data

volumes:
  elfaria-data:
  lavalink-plugins:
