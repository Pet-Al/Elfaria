# HorizontalPodAutoscaler — the "dynamic scaling" piece.
#
# It watches the Lavalink StatefulSet's CPU utilisation and adds/removes pods to
# hold the target. Each new pod (lavalink-1, lavalink-2, …) comes up with its
# stable DNS name; the bot already has a node entry pointing at it (LAVALINK_NODES
# is pre-sized to maxReplicas), so lavalink-client connects as soon as the pod is
# ready and starts routing new players to it. Scale-in removes the highest
# ordinal first.
#
# Two signals, scaled on whichever demands MORE pods:
#   - active players per node (the real workload metric, from the bot's
#     elfaria_active_players gauge via Prometheus + the Prometheus Adapter), and
#   - CPU utilisation (a safety net, and the only one that works before the
#     monitoring stack is installed).
#
# The players metric needs the monitoring add-ons in k8s/monitoring/. Until those
# are installed the HPA reports that one external metric as "unknown" and scales
# on CPU alone (it will hold off on scale-DOWN while a metric is unknown — that's
# the conservative, safe behaviour). Once the adapter serves the metric, players
# drive scaling. To run CPU-only, delete the External metric block below.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lavalink
  namespace: elfaria
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: lavalink
  minReplicas: 1
  # IMPORTANT: keep this in sync with the number of nodes declared in
  # LAVALINK_NODES in k8s/bot-deployment.yaml. The bot can only use pods it has a
  # node entry for, so maxReplicas must not exceed that count.
  maxReplicas: 4
  metrics:
    # Target ~50 simultaneous players per Lavalink pod. With an External metric,
    # AverageValue divides the total by the StatefulSet's current replica count,
    # so desiredReplicas ≈ ceil(total_players / 50).
    - type: External
      external:
        metric:
          name: elfaria_active_players
        target:
          type: AverageValue
          averageValue: '50'
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # React fast to load spikes.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      # Scale in slowly: removing a pod kills the player sessions living on it
      # (Lavalink has no session migration), so we wait until load is durably low.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
